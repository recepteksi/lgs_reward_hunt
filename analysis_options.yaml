# Recipely's TypeScript settings, in Dart terms: the compiler is the first
# reviewer, and anything it can be made to catch should not be left to one.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Not warnings. A missing return or an unawaited future is a defect, and a
    # warning in a list of warnings is a defect nobody is required to fix.
    missing_return: error
    unawaited_futures: error
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.config.dart"
    - "lib/presentation/base/ui/values/l10n/generated/**"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # ── The layer line, as far as a linter can see it ──────────────────────
    # Package imports everywhere: a `../../..` says nothing about which layer
    # it crossed, and crossing one is exactly what needs to be visible.
    always_use_package_imports: true

    # ── Types ─────────────────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_lambdas: true

    # ── Widgets ───────────────────────────────────────────────────────────
    use_key_in_widget_constructors: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    sized_box_for_whitespace: true
    use_colored_box: true

    # ── Async ─────────────────────────────────────────────────────────────
    # A `BuildContext` used after an await belongs to a widget that may be
    # gone. This is the crash that only happens on a slow network.
    use_build_context_synchronously: true
    avoid_slow_async_io: true

    # ── Mistakes this project has made, or would make next ────────────────
    # A debug print left in a test; a doc comment naming a type that moved or
    # was renamed (every move in this repo renames something); a `default:`
    # that hides a new enum member from every switch over it; a subscription
    # or sink nobody closes.
    avoid_print: true
    comment_references: true
    no_default_cases: true
    exhaustive_cases: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    unnecessary_statements: true
    literal_only_boolean_expressions: true
    no_literal_bool_comparisons: true
    unnecessary_null_checks: true
    test_types_in_equals: true
    invalid_case_patterns: true
    avoid_positional_boolean_parameters: true
    avoid_unused_constructor_parameters: true
    prefer_void_to_null: true
    use_super_parameters: true
    type_annotate_public_apis: true
    # Dead public code costs every reader and every agent that opens the file.
    unreachable_from_main: true
    # Deliberately NOT enabled, each with a reason:
    #  * discarded_futures — `create: (_) => getIt<X>()..load()` is how every
    #    page starts its Cubit; `unawaited_futures` (an error above) already
    #    catches a forgotten await inside async code, where it matters.
    #  * avoid_catches_without_on_clauses — a repository is the boundary that
    #    turns ANY throw into a Failure; narrowing its catch would let one escape.
    #  * missing_whitespace_between_adjacent_strings — the avatar SVG markup is
    #    split across adjacent literals on purpose.

    # ── Readability ───────────────────────────────────────────────────────
    directives_ordering: true
    require_trailing_commas: true
    unnecessary_parenthesis: true
    # `avoid_redundant_argument_values` is deliberately NOT enabled. It forbids
    # stating a default on purpose — `themeMode: ThemeMode.system` says the app
    # follows the device and would keep saying it if the framework's default
    # ever changed. A lint that cannot tell that from noise costs more than the
    # noise it removes.
