name: lgs_reward_hunt
description: "LGS Ödül Avı — ebeveyn kontrollü, oyunlaştırılmış görev ve ödül uygulaması."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^18.0.1
  intl: ^0.20.3
  equatable: ^2.1.0
  either_dart: ^1.0.0
  dio: ^5.9.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  json_annotation: ^4.12.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  flutter_flavorizr: ^2.6.0
  json_serializable: ^6.14.1
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Required for `flutter gen-l10n` to emit importable code.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ── Fonts ────────────────────────────────────────────────────────────────
  # One family, bundled rather than fetched. `google_fonts` downloads a face on
  # first launch and silently falls back to the platform default when the device
  # is offline — for an app a student opens on the bus, that is the whole look
  # disappearing at the worst moment. Bundling also keeps the OFL licence in the
  # repository next to the file it covers.
  #
  # Nunito is a VARIABLE font, and since Flutter 3.22 a `FontWeight` sets the
  # `wght` axis directly, so 700, 800 and 900 all come out of one 300 KB face
  # instead of three static cuts.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

  # The mock backend's content, as the server would hold it: the avatar
  # catalogue, the suggested task plan and reward pool, and the demo household.
  # Data only — the rules that move points live in the mock handlers.
  assets:
    - assets/mock/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ── Flavors ──────────────────────────────────────────────────────────────────
# Two environments, and the ONLY difference that matters is which backend and
# which store listing they point at. `dev` carries a suffixed id and its own
# name so both can sit on one device at the same time — the alternative is
# uninstalling one to test the other, which is how a tester ends up reporting a
# bug against the wrong build.
#
# Regenerate with: dart run flutter_flavorizr
flavorizr:
  ide: "vscode"

  # The default instruction set is the default MINUS every `flutter:*` step.
  # Those four write `lib/flavors.dart`, `lib/app.dart`, `lib/pages/` and
  # `lib/main.dart` at the package root — the layout this project deliberately
  # does not have. `main.dart` is the only file outside a layer; the flavor
  # enum lives in `infrastructure/config/` and the shell in `presentation/`.
  # Listing the steps explicitly means `dart run flutter_flavorizr -f` rewrites
  # `android/` and `ios/` and leaves `lib/` alone.
  instructions:
    - "assets:download"
    - "assets:extract"
    - "android:androidManifest"
    - "android:flavorizrGradle"
    - "android:buildGradle"
    - "android:dummyAssets"
    - "android:icons"
    - "ios:podfile"
    - "ios:xcconfig"
    - "ios:buildTargets"
    - "ios:schema"
    - "ios:dummyAssets"
    - "ios:icons"
    - "ios:plist"
    - "ios:launchScreen"
    - "assets:clean"
    - "ide:config"

  app:
    android:
      flavorDimensions: "environment"

  flavors:
    dev:
      app:
        name: "LGS Ödül Avı Dev"
      android:
        applicationId: "com.lgsrewardhunt.app.dev"
        icon: "assets/brand/icon_dev.png"
        adaptiveIcon:
          foreground: "assets/brand/adaptive_foreground_dev.png"
          background: "assets/brand/adaptive_background.png"
      ios:
        bundleId: "com.lgsrewardhunt.app.dev"
        buildSettings:
          GOOGLE_CLIENT_ID: "451080433558-9fq808gdb1c3omhroci82mnsllk4ukn6.apps.googleusercontent.com"
          GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.451080433558-9fq808gdb1c3omhroci82mnsllk4ukn6"
          CODE_SIGN_ENTITLEMENTS: "Runner/Runner.entitlements"
          DEVELOPMENT_TEAM: "8PB3FJ7CPA"
        icon: "assets/brand/icon_dev.png"

    prod:
      app:
        name: "LGS Ödül Avı"
      android:
        applicationId: "com.lgsrewardhunt.app"
        icon: "assets/brand/icon_prod.png"
        adaptiveIcon:
          foreground: "assets/brand/adaptive_foreground_prod.png"
          background: "assets/brand/adaptive_background.png"
      ios:
        bundleId: "com.lgsrewardhunt.app"
        buildSettings:
          GOOGLE_CLIENT_ID: "451080433558-39beqcc5vqimbkiuv6n5o7fvmv891t24.apps.googleusercontent.com"
          GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.451080433558-39beqcc5vqimbkiuv6n5o7fvmv891t24"
          CODE_SIGN_ENTITLEMENTS: "Runner/Runner.entitlements"
          DEVELOPMENT_TEAM: "8PB3FJ7CPA"
        icon: "assets/brand/icon_prod.png"
